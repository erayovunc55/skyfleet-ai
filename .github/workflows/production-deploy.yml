name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  validate:
    name: Production validation
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, sqlite3
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel validation environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run production release gate
        env:
          HEALTH_URL: http://127.0.0.1:8000/api/health
        run: npm run release:check

      - name: Confirm deployment readiness
        run: echo "Production release checks passed. Host deployment can proceed."
